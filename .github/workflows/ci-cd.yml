name: CI/CD Pipeline for GitHub Pages

on:
  push:
    branches: [ main ]  # Trigger when pushing to main branch

jobs:
  validate:
    name: Validate HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # HTML Validator
      - name: Validate HTML files
        uses: Cyb3r-Jak3/html5validator-action@v1.0.2
        with:
          root: '.' # Location of your HTML files

      # CSS Linting
      - name: Install stylelint
        run: npm install -g stylelint stylelint-config-standard

      - name: Lint CSS files
        run: stylelint "**/*.css"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Root folder to deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
